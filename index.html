<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Periscope</title>
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong mode. -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('periscope-theme')
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches
          // Default is light: dark only when explicitly chosen, or when the
          // user picked "system" and the OS is dark.
          var dark = stored === 'dark' || (stored === 'system' && prefersDark)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
